<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WhatsApp Clone (Private Chat)</title>
  <script src="/socket.io/socket.io.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      box-sizing: border-box;
    }

    body {
      display: flex;
      height: 100vh;
      background: #f0f2f5;
    }

    /* SIDEBAR */
    .sidebar {
      width: 30%;
      background: #fff;
      border-right: 1px solid #ddd;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      background: #075e54;
      color: white;
      padding: 15px;
      font-weight: bold;
    }

    .user {
      padding: 15px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
    }

    .user:hover {
      background: #f5f5f5;
    }

    /* CHAT AREA */
    .chat {
      width: 70%;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      background: #075e54;
      color: white;
      padding: 15px;
    }

    .messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 60%;
      padding: 10px;
      border-radius: 10px;
      word-wrap: break-word;
    }

    .me {
      background: #dcf8c6;
      align-self: flex-end;
    }

    .other {
      background: #fff;
      align-self: flex-start;
    }

    .input-area {
      display: flex;
      padding: 10px;
      background: #eee;
    }

    input {
      flex: 1;
      padding: 10px;
      border: none;
      outline: none;
    }

    button {
      margin-left: 10px;
      padding: 10px 15px;
      background: #075e54;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #0b7d6b;
    }
  </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="sidebar-header">Users</div>
  <div id="userList"></div>
</div>

<!-- CHAT -->
<div class="chat">
  <div class="chat-header" id="chatHeader">Select a user</div>

  <div class="messages" id="messages"></div>

  <div class="input-area">
    <input type="text" id="msgInput" placeholder="Type message..." />
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
const socket = io();

const myName = prompt("Enter your name:");
let currentUser = null;
let currentRoom = null;

/* USER LIST (dummy data) */
const users = ["budi", "siti", "andi", "joni"].filter(u => u !== myName);

const userList = document.getElementById("userList");

/* render users */
users.forEach(user => {
  const div = document.createElement("div");
  div.className = "user";
  div.innerText = user;

  div.onclick = async () => {
    currentUser = user;

    document.getElementById("chatHeader").innerText = user;

    currentRoom = createRoom(myName, user);

    socket.emit("joinPrivate", currentRoom);

    loadHistory(currentRoom);
  };

  userList.appendChild(div);
});

/* create room id */
function createRoom(a, b) {
  return [a, b].sort().join("_");
}

/* SEND MESSAGE */
function sendMessage() {
  const msg = document.getElementById("msgInput").value;
  if (!msg || !currentUser) return;

  socket.emit("privateMessage", {
    sender: myName,
    receiver: currentUser,
    message: msg
  });

  document.getElementById("msgInput").value = "";
}

/* RECEIVE MESSAGE */
socket.on("receiveMessage", (data) => {
  if (!currentRoom || data.room !== currentRoom) return;

  const div = document.createElement("div");
  div.className = "msg";

  if (data.sender === myName) {
    div.classList.add("me");
  } else {
    div.classList.add("other");
  }

  div.innerHTML = `<b>${data.sender}</b><br>${data.message}`;

  document.getElementById("messages").appendChild(div);
});

/* LOAD CHAT HISTORY */
function loadHistory(roomId) {
  fetch(`/messages/${roomId}`)
    .then(res => res.json())
    .then(data => {
      const box = document.getElementById("messages");
      box.innerHTML = "";

      data.forEach(d => {
        const div = document.createElement("div");
        div.className = "msg";

        if (d.sender === myName) {
          div.classList.add("me");
        } else {
          div.classList.add("other");
        }

        div.innerHTML = `<b>${d.sender}</b><br>${d.message}`;

        box.appendChild(div);
      });
    });
}
</script>

</body>
</html>
