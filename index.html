<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Simple WhatsApp Clone</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      background: #f0f2f5;
    }

    /* SIDEBAR */
    .sidebar {
      width: 30%;
      background: #fff;
      border-right: 1px solid #ddd;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 15px;
      font-weight: bold;
      background: #075e54;
      color: white;
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
    }

    .chat-item {
      padding: 15px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .chat-item:hover {
      background: #f5f5f5;
    }

    /* CHAT AREA */
    .chat-area {
      width: 70%;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      padding: 15px;
      background: #075e54;
      color: white;
    }

    .messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 60%;
      padding: 10px;
      border-radius: 10px;
      word-wrap: break-word;
    }

    .me {
      background: #dcf8c6;
      align-self: flex-end;
    }

    .other {
      background: #fff;
      align-self: flex-start;
    }

    .input-area {
      display: flex;
      padding: 10px;
      background: #eee;
    }

    input {
      flex: 1;
      padding: 10px;
      border: none;
      outline: none;
      border-radius: 5px;
    }

    button {
      margin-left: 10px;
      padding: 10px 15px;
      background: #075e54;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }

    button:hover {
      background: #0b7d6b;
    }
  </style>
</head>

<body>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-header">Chats</div>
    <div class="chat-list" id="chatList"></div>
  </div>

  <!-- CHAT AREA -->
  <div class="chat-area">
    <div class="chat-header" id="chatHeader">Select Chat</div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
      <input type="text" id="msgInput" placeholder="Type a message..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

<script>
const socket = io();

/* ======================
   SIMPLE USER SYSTEM
====================== */
const myName = prompt("Enter your name:");
let currentChat = "global";

/* JOIN DEFAULT ROOM */
socket.emit("joinRoom", "global");

/* ======================
   SEND MESSAGE
====================== */
function sendMessage() {
  const input = document.getElementById("msgInput");
  const text = input.value;

  if (!text) return;

  const data = {
    sender: myName,
    room: currentChat,
    message: text,
    type: "text"
  };

  socket.emit("sendMessage", data);

  input.value = "";
}

/* ======================
   RECEIVE MESSAGE
====================== */
socket.on("receiveMessage", (data) => {
  const messages = document.getElementById("messages");

  const msg = document.createElement("div");
  msg.classList.add("msg");

  if (data.sender === myName) {
    msg.classList.add("me");
  } else {
    msg.classList.add("other");
  }

  msg.innerHTML = `<b>${data.sender}</b><br>${data.message}`;

  messages.appendChild(msg);
  messages.scrollTop = messages.scrollHeight;
});

/* ======================
   LOAD CHAT LIST (STATIC)
====================== */
const chatList = document.getElementById("chatList");

const chats = ["global", "group-1", "group-2"];

chats.forEach(chat => {
  const div = document.createElement("div");
  div.classList.add("chat-item");
  div.innerText = chat;

  div.onclick = () => {
    currentChat = chat;
    document.getElementById("chatHeader").innerText = chat;

    document.getElementById("messages").innerHTML = "";

    socket.emit("joinRoom", chat);
  };

  chatList.appendChild(div);
});
</script>

</body>
</html>
