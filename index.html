<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WhatsApp Clone</title>
  <script src="/socket.io/socket.io.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      font-family: Arial;
      box-sizing: border-box;
    }

    body {
      display: flex;
      height: 100vh;
      background: #f0f2f5;
    }

    /* LOGIN SCREEN */
    #loginBox {
      position: absolute;
      width: 100%;
      height: 100%;
      background: #075e54;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: white;
    }

    #loginBox input {
      padding: 10px;
      width: 200px;
      margin-top: 10px;
      border: none;
      outline: none;
    }

    #loginBox button {
      margin-top: 10px;
      padding: 10px 20px;
      border: none;
      cursor: pointer;
    }

    /* APP */
    .app {
      display: none;
      width: 100%;
    }

    .sidebar {
      width: 30%;
      background: white;
      border-right: 1px solid #ddd;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #075e54;
      color: white;
      padding: 15px;
      font-weight: bold;
    }

    .user {
      padding: 15px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
    }

    .online {
      color: green;
      font-size: 12px;
    }

    .offline {
      color: gray;
      font-size: 12px;
    }

    .chat {
      width: 70%;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      background: #075e54;
      color: white;
      padding: 15px;
    }

    .messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 60%;
      padding: 10px;
      border-radius: 10px;
    }

    .me { background: #dcf8c6; align-self: flex-end; }
    .other { background: #fff; align-self: flex-start; }

    .input {
      display: flex;
      padding: 10px;
      background: #eee;
    }

    input {
      flex: 1;
      padding: 10px;
      border: none;
      outline: none;
    }

    button {
      margin-left: 10px;
      padding: 10px;
      background: #075e54;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
  <h2>Login Chat</h2>
  <input id="username" placeholder="Enter username" />
  <button onclick="login()">Enter</button>
</div>

<!-- APP -->
<div class="app" id="app">

  <div class="sidebar">
    <div class="header">Users Online</div>
    <div id="userList"></div>
  </div>

  <div class="chat">
    <div class="chat-header" id="chatHeader">Select user</div>
    <div class="messages" id="messages"></div>

    <div class="input">
      <input id="msgInput" placeholder="type message..." />
      <button onclick="send()">Send</button>
    </div>
  </div>

</div>

<script>
const socket = io();

let myName = null;
let currentUser = null;
let currentRoom = null;
let onlineList = [];

/* LOGIN */
function login() {
  const name = document.getElementById("username").value;
  if (!name) return;

  myName = name;

  socket.emit("login", myName);

  document.getElementById("loginBox").style.display = "none";
  document.getElementById("app").style.display = "flex";
}

/* UPDATE ONLINE USERS */
socket.on("updateOnlineUsers", (users) => {
  onlineList = users;
  renderUsers();
});

/* RENDER USERS */
function renderUsers() {
  const list = document.getElementById("userList");
  list.innerHTML = "";

  const dummy = ["budi", "siti", "andi", "joni"].filter(u => u !== myName);

  dummy.forEach(user => {
    const div = document.createElement("div");
    div.className = "user";

    const status = onlineList.includes(user)
      ? `<span class="online">online</span>`
      : `<span class="offline">offline</span>`;

    div.innerHTML = `<span>${user}</span>${status}`;

    div.onclick = () => {
      currentUser = user;
      currentRoom = [myName, user].sort().join("_");

      document.getElementById("chatHeader").innerText = user;

      socket.emit("joinPrivate", currentRoom);
      loadHistory(currentRoom);
    };

    list.appendChild(div);
  });
}

/* SEND MESSAGE */
function send() {
  const msg = document.getElementById("msgInput").value;
  if (!msg || !currentUser) return;

  socket.emit("privateMessage", {
    sender: myName,
    receiver: currentUser,
    message: msg
  });

  document.getElementById("msgInput").value = "";
}

/* RECEIVE MESSAGE */
socket.on("receiveMessage", (data) => {
  if (!currentRoom || data.room !== currentRoom) return;

  const div = document.createElement("div");
  div.className = "msg";

  div.classList.add(data.sender === myName ? "me" : "other");

  div.innerHTML = `<b>${data.sender}</b><br>${data.message}`;

  document.getElementById("messages").appendChild(div);
});

/* LOAD HISTORY */
function loadHistory(roomId) {
  fetch(`/messages/${roomId}`)
    .then(res => res.json())
    .then(data => {
      const box = document.getElementById("messages");
      box.innerHTML = "";

      data.forEach(d => {
        const div = document.createElement("div");
        div.className = "msg";

        div.classList.add(d.sender === myName ? "me" : "other");

        div.innerHTML = `<b>${d.sender}</b><br>${d.message}`;

        box.appendChild(div);
      });
    });
}
</script>

</body>
</html>
