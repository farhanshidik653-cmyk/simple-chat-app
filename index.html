<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mini WhatsApp + IG Chat</title>
<script src="/socket.io/socket.io.js"></script>

<style>
body { margin:0; font-family:Arial; display:flex; height:100vh; }

/* LOGIN */
#login {
  position:absolute;
  width:100%; height:100%;
  background:#075e54;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  color:white;
}

#app { display:none; width:100%; }

/* SIDEBAR */
.sidebar {
  width:30%;
  background:#fff;
  border-right:1px solid #ddd;
  display:flex;
  flex-direction:column;
}

.header {
  background:#075e54;
  color:white;
  padding:10px;
}

.user {
  padding:10px;
  cursor:pointer;
  border-bottom:1px solid #eee;
}

.user:hover { background:#f5f5f5; }

button {
  margin:5px;
  padding:8px;
}

/* CHAT */
.chat {
  width:70%;
  display:flex;
  flex-direction:column;
}

.chat-header {
  background:#075e54;
  color:white;
  padding:10px;
}

.messages {
  flex:1;
  padding:10px;
  overflow-y:auto;
}

.msg {
  padding:8px;
  margin:5px;
  border-radius:8px;
  max-width:60%;
}

.me { background:#dcf8c6; margin-left:auto; }
.other { background:#fff; }

.input {
  display:flex;
  padding:10px;
}

input {
  flex:1;
  padding:8px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <h2>Login</h2>
  <input id="name" placeholder="username">
  <button onclick="login()">Enter</button>
</div>

<!-- APP -->
<div id="app">

  <div class="sidebar">
    <div class="header">Users</div>
    <div id="users"></div>

    <button onclick="createGroup()">+ Create Group</button>
  </div>

  <div class="chat">
    <div class="chat-header" id="chatTitle">Select chat</div>

    <div class="messages" id="msgs"></div>

    <div class="input">
      <input id="msg" placeholder="message">
      <button onclick="send()">Send</button>
    </div>
  </div>

</div>

<script>
const socket = io();

let me = "";
let currentRoom = "";
let currentTarget = "";
let selectedUsers = [];

/* LOGIN */
function login(){
  me = document.getElementById("name").value;
  if(!me) return;

  socket.emit("login", me);

  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="flex";
}

/* USERS */
socket.on("onlineUsers", (users)=>{
  const box = document.getElementById("users");
  box.innerHTML="";

  users.forEach(u=>{
    if(u === me) return;

    const div = document.createElement("div");
    div.className="user";
    div.innerText=u;

    div.onclick = ()=>{
      currentTarget = u;
      currentRoom = [me,u].sort().join("_");

      socket.emit("joinPrivate", currentRoom);
      load(currentRoom);

      document.getElementById("chatTitle").innerText = u;
    };

    box.appendChild(div);
  });
});

/* CREATE GROUP SIMPLE */
function createGroup(){
  const name = prompt("Group name?");
  const users = prompt("Users (comma separated)").split(",");

  users.push(me);

  socket.emit("createGroup", {
    groupName:name,
    members:users
  });
}

/* SEND */
function send(){
  const msg = document.getElementById("msg").value;

  if(!msg) return;

  socket.emit("sendMessage", {
    roomId: currentRoom,
    sender: me,
    message: msg
  });

  document.getElementById("msg").value="";
}

/* RECEIVE */
socket.on("receiveMessage", (data)=>{
  if(data.roomId !== currentRoom) return;

  const div = document.createElement("div");
  div.className = "msg";

  div.classList.add(data.sender === me ? "me":"other");
  div.innerText = data.sender + ": " + data.message;

  document.getElementById("msgs").appendChild(div);
});

/* LOAD HISTORY */
function load(room){
  fetch("/messages/"+room)
  .then(r=>r.json())
  .then(data=>{
    const box=document.getElementById("msgs");
    box.innerHTML="";

    data.forEach(d=>{
      const div=document.createElement("div");
      div.className="msg";
      div.classList.add(d.sender===me?"me":"other");
      div.innerText=d.sender+": "+d.message;
      box.appendChild(div);
    });
  });
}
</script>

</body>
</html>
